<!DOCTYPE html>
<html>
<head>
    <title>StudySprint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero-card"></div>

  <h1>⚡ STUDY SPRINT ⚡</h1>
<p>HERO TRAINING HQ</p>

<div class="mission-input">
    <input type="text" placeholder="Enter your training mission...">
    <button>Add Mission</button>
</div>
<div class="filters">
    <button id="allBtn">ALL</button>
    <button id="activeBtn">ACTIVE</button>
    <button id="completedBtn">COMPLETED</button>
</div>

  <ul id="taskList">
    </ul>
    <div class="progress">
    <h2>⚡ HERO PROGRESS ⚡</h2>
    <h3 id="heroRank">HERO RANK: ROOKIE</h3>

<div class="progress-bar">
    <div id="progressFill"></div>
</div>

<p id="progressPercent">0% Complete</p>

    <div class="stats">
        <div>
            <h3 id="totalTasks">0</h3>
            <p>Total Missions</p>
        </div>

        <div>
            <h3 id="completedTasks">0</h3>
            <p>Completed</p>
        </div>

        <div>
            <h3 id="remainingTasks">0</h3>
            <p>Remaining</p>
        </div>
    </div>
</div>
</div>
    <script src="script.js"></script>

</body>
</html>
